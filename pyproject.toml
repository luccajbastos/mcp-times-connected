[project]
name = "connected-mcp"
version = "0.1.0"
description = "MCP server para o agendador de aulas Times Connected"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2,<2", "httpx"]

[project.scripts]
connected-mcp = "connected_mcp.server:main"

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "respx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connected_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
